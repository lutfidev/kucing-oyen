name: kucing_oren
description: "Kucing Oren: game puzzle kucing oren (Flutter + Flame)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    # Lisensi font (ditampilkan di halaman lisensi aplikasi).
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Nunito.txt

  # Font dibundel supaya tidak perlu diunduh saat aplikasi jalan.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
