name: kucing_oren
description: "Kucing Oren: game puzzle kucing oren (Flutter + Flame)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  google_mobile_ads: ^9.1.0
  intl: any
  package_info_plus: ^10.2.2
  path_drawing: ^1.0.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  # Teks per bahasa dari lib/l10n/*.arb (gen-l10n).
  generate: true
  assets:
    - assets/levels/
    # Lisensi font (ditampilkan di halaman lisensi aplikasi).
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Nunito.txt
    # Musik (buatan sendiri) dan efek suara (CC0), lihat tool/audio/.
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/LICENSE-sfx.txt

  # Font dibundel supaya tidak perlu diunduh saat aplikasi jalan.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
